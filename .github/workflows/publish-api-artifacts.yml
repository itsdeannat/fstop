name: publish-api-artifacts 
on:
  push:
    branches: ["main"]
    paths:
      - "**.yaml"
      - "**.yml"

  workflow_dispatch:
    inputs:
      skip_sdk:
        description: "Skip SDK generation"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  run-specgate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Install SpecGate
        run: go install github.com/itsdeannat/specgate@latest

      - name: Create SpecGate config
        run: $(go env GOPATH)/bin/specgate init

      - name: Check OpenAPI spec
        run: $(go env GOPATH)/bin/specgate check schema.yml

  update-sdk:
    if: ${{ !inputs.skip_sdk }}
    needs: run-specgate
    runs-on: ubuntu-latest
    steps:
      - name: Check out API repo
        uses: actions/checkout@v4
        with:
          path: 'api'

      - name: Check out SDK repo
        uses: actions/checkout@v4
        with:
            repository: 'itsdeannat/fstop-python-sdk'
            path: 'sdk'
            ref: 'dev'
            token: ${{ secrets.PAT_TOKEN }}

      - name: Install Speakeasy
        run: curl -fsSL https://go.speakeasy.com/cli-install.sh | sh

      - name: Copy OAS
        run: cp api/schema.yml sdk/schema.yml

      - name: Run Speakeasy
        env:
          SPEAKEASY_API_KEY: ${{ secrets.SPEAKEASY_API_KEY }}
        run: |
          cd sdk
          speakeasy run

      - name: Commit SDK changes
        run: |
          cd sdk
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Regenerate SDK from API changes" || echo "No changes to commit"
          git push https://x-access-token:${{ secrets.PAT_TOKEN }}@github.com/itsdeannat/fstop-python-sdk.git HEAD:dev

  update-api-referencec-docs:
    needs: run-specgate
    runs-on: ubuntu-latest

    steps:
      - name: Check out API repo
        uses: actions/checkout@v4
        with:
          path: 'api'
    
      - name: Check out docs repo
        uses: actions/checkout@v4
        with:
            repository: 'itsdeannat/fstop-docs'
            path: 'docs'
            ref: 'dev'
            token: ${{ secrets.PAT_TOKEN }}

      - name: Install Redocly
        run: npx i @redocly/cli@latest

      - name: Copy OAS
        run: cp api/schema.yml docs/schema.yml

      - name: Generate reference docs
        run: |
          cd docs
          redocly build-docs schema.yml --output=public/api-reference.html

      - name: Commit doc changes
        run: |
          cd docs
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Regenerate reference docs from API changes" || echo "No changes to commit"
          git push https://x-access-token:${{ secrets.PAT_TOKEN }}@github.com/itsdeannat/fstop-docs.git HEAD:dev
