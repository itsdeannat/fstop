components:
  schemas:
    Booking:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        project:
          allOf:
          - $ref: '#/components/schemas/Project'
          readOnly: true
        project_id:
          type: string
          format: uuid
          writeOnly: true
        date:
          type: string
          format: date
        time:
          type: string
          format: time
        duration:
          type: integer
          maximum: 9223372036854775807
          minimum: -9223372036854775808
          format: int64
        location:
          type: string
          maxLength: 20
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - date
      - duration
      - id
      - location
      - project
      - project_id
      - time
    Client:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        first_name:
          type: string
          maxLength: 20
        last_name:
          type: string
          maxLength: 20
        city:
          type: string
          maxLength: 20
        state:
          type: string
          maxLength: 2
        zip_code:
          type: string
          maxLength: 20
        email:
          type: string
          format: email
          maxLength: 254
        phone_number:
          type: string
          maxLength: 128
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - city
      - created_at
      - email
      - first_name
      - id
      - last_name
      - phone_number
      - state
      - zip_code
    Gallery:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        project:
          allOf:
          - $ref: '#/components/schemas/Project'
          readOnly: true
        project_id:
          type: string
          format: uuid
          writeOnly: true
        gallery_name:
          type: string
          maxLength: 50
        picture_count:
          type: integer
          maximum: 9223372036854775807
          minimum: -9223372036854775808
          format: int64
        is_visible:
          type: boolean
        url:
          type: string
          format: uri
          maxLength: 200
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - gallery_name
      - id
      - is_visible
      - picture_count
      - project
      - project_id
      - url
    PatchedBooking:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        project:
          allOf:
          - $ref: '#/components/schemas/Project'
          readOnly: true
        project_id:
          type: string
          format: uuid
          writeOnly: true
        date:
          type: string
          format: date
        time:
          type: string
          format: time
        duration:
          type: integer
          maximum: 9223372036854775807
          minimum: -9223372036854775808
          format: int64
        location:
          type: string
          maxLength: 20
        created_at:
          type: string
          format: date-time
          readOnly: true
    PatchedClient:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        first_name:
          type: string
          maxLength: 20
        last_name:
          type: string
          maxLength: 20
        city:
          type: string
          maxLength: 20
        state:
          type: string
          maxLength: 2
        zip_code:
          type: string
          maxLength: 20
        email:
          type: string
          format: email
          maxLength: 254
        phone_number:
          type: string
          maxLength: 128
        created_at:
          type: string
          format: date-time
          readOnly: true
    PatchedGallery:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        project:
          allOf:
          - $ref: '#/components/schemas/Project'
          readOnly: true
        project_id:
          type: string
          format: uuid
          writeOnly: true
        gallery_name:
          type: string
          maxLength: 50
        picture_count:
          type: integer
          maximum: 9223372036854775807
          minimum: -9223372036854775808
          format: int64
        is_visible:
          type: boolean
        url:
          type: string
          format: uri
          maxLength: 200
        created_at:
          type: string
          format: date-time
          readOnly: true
    PatchedProject:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        project_name:
          type: string
          maxLength: 20
        project_type:
          $ref: '#/components/schemas/ProjectTypeEnum'
        client:
          allOf:
          - $ref: '#/components/schemas/Client'
          readOnly: true
        client_id:
          type: string
          format: uuid
          writeOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
    Project:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        project_name:
          type: string
          maxLength: 20
        project_type:
          $ref: '#/components/schemas/ProjectTypeEnum'
        client:
          allOf:
          - $ref: '#/components/schemas/Client'
          readOnly: true
        client_id:
          type: string
          format: uuid
          writeOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - client
      - client_id
      - created_at
      - id
      - project_name
    ProjectTypeEnum:
      enum:
      - event
      - portrait
      - party
      type: string
      description: |-
        * `event` - Event
        * `portrait` - Portrait
        * `party` - Party
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
    cookieAuth:
      type: apiKey
      in: cookie
      name: sessionid
