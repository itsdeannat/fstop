components:
  schemas:
    BadRequest:
      type: object
      description: Serializer for 400 Bad Request responses
      properties:
        detail:
          type: string
          default: Invalid JSON in request body
    Booking:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
          description: Unique identifier for the booking
        project_id:
          type: string
          format: uuid
          writeOnly: true
          description: UUID of the project for this booking
        project:
          allOf:
          - $ref: '#/components/schemas/Project'
          readOnly: true
          description: Project associated with this booking
        date:
          type: string
          format: date
          description: Date of the booking
        time:
          type: string
          format: time
          description: Time of the booking
        duration:
          type: integer
          description: Booking duration in minutes
        location:
          type: string
          description: Booking location
          maxLength: 20
        created_at:
          type: string
          format: date-time
          readOnly: true
          description: When the booking was created
      required:
      - created_at
      - date
      - duration
      - id
      - location
      - project
      - project_id
      - time
    BookingCreate:
      type: object
      description: Serializer for creating bookings - excludes read-only fields (id,
        project, created_at)
      properties:
        project_id:
          type: string
          format: uuid
          description: UUID of the project for this booking
        date:
          type: string
          format: date
          description: Date of the booking
        time:
          type: string
          format: time
          description: Time of the booking
        duration:
          type: integer
          description: Booking duration in minutes
        location:
          type: string
          description: Booking location
          maxLength: 20
      required:
      - date
      - duration
      - location
      - project_id
      - time
